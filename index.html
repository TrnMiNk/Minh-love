<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi Em Iu Dấuuu!!!! 💖</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html{scroll-behavior:smooth;}
body{
margin:0;
font-family:'Poppins',sans-serif;
overflow-x:hidden;
color:white;
}

/* VIDEO */
video{
position:fixed;
right:0;bottom:0;
min-width:100%;min-height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.5);
}

.overlay{
position:fixed;
width:100%;height:100%;
background:linear-gradient(135deg,#ff69b4aa,#ff1493aa);
z-index:-1;
}

/* PASSWORD */
#password-screen{
position:fixed;
width:100%;height:100%;
background:linear-gradient(135deg,#ff69b4,#ff1493);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
}

/* NAVBAR */
.navbar{
background:linear-gradient(90deg,#000000,#111111);
backdrop-filter:blur(10px);
box-shadow:0 5px 20px rgba(0,0,0,0.6);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.navbar a{
color:white !important;
letter-spacing:1px;
}


/* MUSIC BAR */
.music-player{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
padding:10px 20px;
border-radius:30px;
display:flex;
align-items:center;
gap:15px;
z-index:1000;
}

.progress{
width:200px;
height:6px;
background:rgba(255,255,255,0.4);
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.progress-bar{
height:100%;
width:0%;
background:white;
}

.wave{
display:flex;
gap:3px;
}

.wave span{
width:4px;
height:10px;
background:white;
animation:wave 1s infinite ease-in-out;
}

.wave span:nth-child(2){animation-delay:0.2s;}
.wave span:nth-child(3){animation-delay:0.4s;}

@keyframes wave{
0%,100%{height:10px;}
50%{height:20px;}
}

/* SECTION */
section{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:80px 20px;
}

/* TITLE */
.valentine-title{
font-family:'Pacifico',cursive;
font-size:4rem;
animation:heartbeat 1.5s infinite;
text-shadow:0 0 20px white;
}
@keyframes heartbeat{
0%,100%{transform:scale(1);}
25%{transform:scale(1.1);}
60%{transform:scale(1.15);}
}

/* IMAGE */
.love-img{
width:250px;height:250px;
border-radius:50%;
object-fit:cover;
border:6px solid white;
box-shadow:0 0 30px rgba(255,255,255,0.8);
}

/* CARD */
.love-card{
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
}

/* ===== ALBUM ===== */
.album-section{
position:relative;
background:linear-gradient(
to bottom,
#000000 0%,
#050505 30%,
#0f0f0f 60%,
#1a1a1a 80%,
#ff4da6 100%
);
overflow:hidden;
padding:120px 0;
}

.album-section::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:radial-gradient(
circle at center,
rgba(255,77,166,0.15),
transparent 70%
);
pointer-events:none;
}

.album-wrapper{
position:relative;
width:100%;
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.album-track{
display:flex;
transition:transform 0.6s ease;
align-items:center;
}

.album-item{
flex:0 0 350px;
margin:0 20px;
transition:0.6s;
opacity:0.4;
transform:scale(0.8);
}

.album-item img{
width:100%;
height:500px;
object-fit:cover;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.album-item.active{
opacity:1;
transform:scale(1);
}

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
font-size:28px;
width:55px;height:55px;
border-radius:50%;
cursor:pointer;
z-index:10;
}

.nav-btn.left{left:-70px;}
.nav-btn.right{right:-70px;}

.nav-btn:hover{
background:#ff1493;
color:white;
}

.fall-heart{
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear forwards;
}
@keyframes fall{
to{transform:translateY(100vh);opacity:0;}
}

footer{
background:#ff1493;
padding:15px;
text-align:center;
}

/* POPUP LETTER */
.letter-overlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(8px);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:0.4s;
z-index:9998;
}

.letter-overlay.active{
opacity:1;
visibility:visible;
}

.letter-box{
background:linear-gradient(135deg,#fff0f5,#ffe4ec);
color:#ff1493;
padding:40px;
border-radius:20px;
max-width:500px;
width:90%;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
position:relative;
animation:popUp 0.4s ease;
}

@keyframes popUp{
from{transform:scale(0.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.close-btn{
position:absolute;
top:15px;
right:20px;
background:none;
border:none;
font-size:20px;
cursor:pointer;
color:#ff1493;
}

.letter-box{
background:linear-gradient(135deg,#fff0f5,#ffe4ec);
color:#ff1493;
padding:40px;
border-radius:25px;
max-width:550px;
width:90%;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
position:relative;
transform:scale(0.5) rotate(-5deg);
opacity:0;
transition:0.5s ease;
}

.letter-overlay.active .letter-box{
transform:scale(1) rotate(0deg);
opacity:1;
}

#typingText{
min-height:150px;
white-space:pre-line;
font-size:18px;
line-height:1.6;
}

/* Tim bay */
.floating-heart{
position:fixed;
color:#ff4da6;
font-size:20px;
animation:floatUp 3s linear forwards;
z-index:9999;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-200px);opacity:0;}
}

/* ===== HOME BACKGROUND IMAGE ===== */
#home{
position:relative;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

#home::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:url("images/Hang1.jpg") center/cover no-repeat;
filter:blur(12px);
transform:scale(1.1);
z-index:-2;
}

#home::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.8));
z-index:-1;
}

/* ===== WISH SECTION ===== */
#wish{
background:linear-gradient(
to bottom,
#ff4da6 0%,
#ff66b2 40%,
#ff85c1 70%,
#ffc0cb 100%
);
padding:120px 0;
position:relative;
}

/* ===== LOGIN LUXURY ===== */
#password-screen{
background:radial-gradient(circle at center,#ff4da6,#d6006c);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(25px);
padding:60px 50px;
border-radius:25px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
text-align:center;
width:350px;
animation:fadeLogin 1s ease;
}

@keyframes fadeLogin{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

.login-title{
font-family:'Pacifico',cursive;
font-size:28px;
margin-bottom:30px;
color:white;
text-shadow:0 0 15px rgba(255,255,255,0.8);
}

.login-box input{
width:100%;
padding:12px 15px;
border-radius:30px;
border:none;
outline:none;
margin-bottom:20px;
text-align:center;
}

.login-box button{
width:100%;
padding:12px;
border-radius:30px;
border:none;
background:white;
color:#ff1493;
font-weight:bold;
transition:0.3s;
}

.login-box button:hover{
background:#ff1493;
color:white;
}

#error{
margin-top:10px;
color:#ffe6f2;
font-size:14px;
}

</style>
</head>
<body>

<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-couple-walking-on-the-beach-1585/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div id="password-screen">
  <div class="login-box">
    <h1 class="login-title">
      Đăng Nhập Để Mở Trái Tim Này Nha 💖
    </h1>

    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu của chúng ta..." />

    <button onclick="checkPassword()">Mở Trái Tim 💌</button>

    <p id="error"></p>
  </div>
</div>


<audio id="bgMusic" src="music/iloveyou.mp3" loop></audio>

<!-- MUSIC PLAYER -->
<div class="music-player">
<button onclick="toggleMusic()" class="btn btn-light btn-sm">🎵</button>
<div class="progress" onclick="seek(event)">
<div class="progress-bar" id="progressBar"></div>
</div>
<div class="wave">
<span></span><span></span><span></span>
</div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
<div class="container">
<a class="navbar-brand" href="#">My Love 💖</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#home">Trang Chủ</a></li>
<li class="nav-item"><a class="nav-link" href="#album">Album</a></li>
<li class="nav-item"><a class="nav-link" href="#wish">Lời Chúc</a></li>
</ul>
</div>
</div>
</nav>

<section id="home">
<div>
<img src="images/Hang1.jpg" class="love-img mb-4">
<h1 class="valentine-title">VALENTINE 💖</h1>
<div id="countdown"></div>
</div>
</section>

<section id="album" class="album-section">
<div class="container">
<h2 class="mb-5">Album Của Chúng Ta 📸</h2>

<div class="album-wrapper">
<button class="nav-btn left" onclick="prevSlide()">❮</button>

<div class="album-track">
<div class="album-item"><img src="images/Hang1.jpg"></div>
<div class="album-item"><img src="images/Hang2.jpg"></div>
<div class="album-item"><img src="images/Hang3.jpg"></div>
<div class="album-item"><img src="images/Hang4.jpg"></div>
<div class="album-item"><img src="images/Hang5.jpg"></div>
<div class="album-item"><img src="images/Hang6.jpg"></div>
</div>

<button class="nav-btn right" onclick="nextSlide()">❯</button>
</div>
</div>
</section>

<section id="wish">
<div class="love-card text-center">
<h2>Lời Chúc 💌</h2>
<button class="btn btn-light mt-3" onclick="openLetter()">Nhấn vào đây để đọc 💖</button>
</div>
</section>

<!-- POPUP LETTER -->
<div id="letterPopup" class="letter-overlay">
<div class="letter-box">
<button class="close-btn" onclick="closeLetter()">✖</button>
<h3>Gửi Hằng 💕</h3>
<p id="typingText"></p>
</div>
</div>



<footer>Made with 💖</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const music=document.getElementById("bgMusic");
const progressBar=document.getElementById("progressBar");

function checkPassword(){
const input = document.getElementById("passwordInput").value.trim();
const correctPassword = "yeuem";

if(input === correctPassword){

  const screen = document.getElementById("password-screen");
  screen.style.opacity = "0";
  screen.style.transition = "0.5s";

  setTimeout(()=>{
    screen.style.display = "none";
  },500);

  if(music){
    music.currentTime = 0;
    music.volume = 1;
    music.play().catch(()=>{});
  }

}else{
document.getElementById("error").innerText="Sai mật khẩu rồi 😢";
}
}


function toggleMusic(){
if(music.paused){
music.play();
}else{
music.pause();
}
}

music.addEventListener("timeupdate",()=>{
let percent=(music.currentTime/music.duration)*100;
progressBar.style.width=percent+"%";
});

function seek(e){
let width=e.currentTarget.clientWidth;
let clickX=e.offsetX;
music.currentTime=(clickX/width)*music.duration;
}

/* COUNTDOWN */
setInterval(()=>{
let val=new Date("Feb 14, 2026 00:00:00").getTime();
let now=new Date().getTime();
let d=val-now;
let days=Math.floor(d/(1000*60*60*24));
let hours=Math.floor((d%(1000*60*60*24))/(1000*60*60));
let mins=Math.floor((d%(1000*60*60))/(1000*60));
let secs=Math.floor((d%(1000*60))/1000);
document.getElementById("countdown").innerHTML=
days+" ngày "+hours+" giờ "+mins+" phút "+secs+" giây 💘";
},1000);

/* HEART RAIN */
setInterval(()=>{
let heart=document.createElement("div");
heart.className="fall-heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=Math.random()*3+2+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
},300);

/* ALBUM */
let currentIndex=0;
const items=document.querySelectorAll(".album-item");
const track=document.querySelector(".album-track");

function updateSlide(){
items.forEach(item=>item.classList.remove("active"));
items[currentIndex].classList.add("active");
const itemWidth=390;
const offset=(window.innerWidth/2-itemWidth/2)-(currentIndex*itemWidth);
track.style.transform=`translateX(${offset}px)`;
}

function nextSlide(){
currentIndex=(currentIndex+1)%items.length;
updateSlide();
}

function prevSlide(){
currentIndex=(currentIndex-1+items.length)%items.length;
updateSlide();
}

setInterval(nextSlide,3000);
updateSlide();

const letterText = 
`Hằng à...

Cảm ơn em vì đã bước vào cuộc đời anh.
Từ ngày có em, mọi thứ đều trở nên dịu dàng hơn.

Anh yêu cách em cười,
yêu cách em quan tâm,
và yêu cả những điều nhỏ nhặt nhất nơi em.

Anh không cần điều gì lớn lao,
chỉ cần mỗi ngày đều có em bên cạnh.

Anh yêu em rất nhiều. 💖`;

let typingIndex = 0;
let typingInterval;

function openLetter(){
document.getElementById("letterPopup").classList.add("active");
document.getElementById("typingText").innerHTML = "";
typingIndex = 0;

const music = document.getElementById("bgMusic");
if(music) music.volume = 0.2;

typingInterval = setInterval(typeEffect,40);

createHearts();
}

function typeEffect(){
if(typingIndex < letterText.length){
document.getElementById("typingText").innerHTML += letterText.charAt(typingIndex);
typingIndex++;
}else{
clearInterval(typingInterval);
}
}

function closeLetter(){
document.getElementById("letterPopup").classList.remove("active");
clearInterval(typingInterval);

const music = document.getElementById("bgMusic");
if(music) music.volume = 1;
}

function createHearts(){
for(let i=0;i<15;i++){
let heart = document.createElement("div");
heart.className = "floating-heart";
heart.innerHTML = "💖";
heart.style.left = Math.random()*100 + "vw";
heart.style.top = "60vh";
heart.style.fontSize = (Math.random()*20+15)+"px";
document.body.appendChild(heart);

setTimeout(()=>{heart.remove();},3000);
}
}



</script>

</body>
</html>
